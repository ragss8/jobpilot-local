name: vastu-architect-ai
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: aangan
      POSTGRES_USER: aangan
      POSTGRES_PASSWORD: aangan-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aangan -d aangan"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
